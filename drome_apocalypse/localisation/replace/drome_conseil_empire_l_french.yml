 ADD_PROVINCES_TO_EMPIRE_DESC:0 "Ceci va permettre aux $NUM|Y$ provinces possibles d'intégrer le Conseil. Le souhaitez-vous vraiment ?"
 IMPERIAL_NO_INCIDENT_TITLE_TOOLTIP:0 "De temps à autre se pose à l'Assemblée générale du Conseil une question qui affecte l'ensemble du Conseil. Le Président doit alors prendre position sur le sujet et faire le choix entre suivre l'avis des communes et conseillers, ou éroder l'ensemble de l'institution."
 IMPERIAL_INCIDENT_SELECTED_OPTION:0 "\nL'§YPrésident§! est favorable à ce choix."
 IMPERIAL_INCIDENT_ENDED_SETUP:0 "Si un incident du Conseil prend fin"
 IMPERIAL_INCIDENT_ENDED_2:0 "L'incident du Conseil $TITLE$ a pris fin.\n$TEXT$"
 NEEDS_TO_NEIGHBOUR_EMPIRE:0 "$TARGET|Y$ doit être limitrophe du Conseil des Communes Libres."
 REICHSKRIEG_DEFENSE_OF_REALM_MODIFIER:0 "Le Président et les conseillers peuvent lever des impôts de guerre sans aucun coût s'ils sont en guerre contre les ennemis du Conseil des Communes Libres."
 defense_of_the_empire_modifier:0 "Défense du Conseil des Communes Libres"
 EXPAND_EMPIRE_CB:0 "Offre un casus belli contre les pays non membres mais limitrophes du Conseil, pour les contraindre à l'intégrer."
 po_reintegrate_into_hre_desc:0 "[From.GetLeLaNPCap] [From.GetName] et toutes [From.GetSesLeursNP] dépendances vont réintégrer le Conseil. [Root.GetLeLaNPCap] [Root.GetName] va gagner §G25§! en cohésion du Conseil."
 CB_ALLOWED_po_reintegrate_into_hre:0 "Réintégrer dans le Conseil"
 PEACE_po_reintegrate_into_hre:0 "Réintégrer dans le Conseil"
 po_reintegrate_into_hre:0 "Réintégrer dans le Conseil"
 IMPERIAL_INCIDENT_STARTED_LOG:0 "Un incident du Conseil est survenu dans le Conseil des Communes Libres."
 IMPERIAL_INCIDENT_ENDED_LOG:0 "Fin de l'incident du Conseil $TITLE$."
 EMPEROR_DIPACTIONS_DESC:0 "\nL'Président peut entreprendre ces actions diplomatiques :\n$LIST|Y$"
 MAPMODE_EMPIRE_DESC:0 "Colore les provinces relevant du Conseil des Communes Libres :\n– le violet désigne les provinces appartenant au Président ;\n– le marron celles appartenant à un conseiller ;\n– le bleu indique celles appartenant à des communes libres ;\n– le vert indique les provinces relevant du Conseil des Communes Libres.\nLes hachures jaunes marquent les provinces relevant du Conseil mais contrôlées par un pays non-membre ; les hachures oranges celles relevant du Conseil mais appartenant à une dépendance d'un suzerain non-membre."
 DISMANTLE_HRE_PRESTIGE_DESC:0 "Dissoudre le Conseil des Communes Libres fait gagner $VAL|G$ en prestige."
 HRE_OTHER_VOTE_SELF:0 "$ELECTOR|Y$ soutient sa propre candidature au trône du Conseil."
 HRE_RELATION_SELF:0 "Au moment d'étudier les candidats au titre de Président, nous nous attribuons $POINTS|Y$ points."
 HRE_CAST_VOTE_DESC:0 "Sélectionner celui que nous souhaitons soutenir pour l'accession au titre de Président."
 CANNOT_UPGRADE_RANK_HRE:0 "§R– Parmi les membres du Conseil des Communes Libres, seuls les conseillers peuvent s'élever au-dessus du rang de duché, sans pouvoir être autre chose qu'un royaume.§!\n"
 CANNOT_UPGRADE_RANK_HRE_ELECTOR:0 "§R– Les conseillers du Conseil des Communes Libres ne peuvent s'élever au-dessus du rang de royaume.§!\n"
 fc_imperial_coronation:0 "Couronnement du Conseil"
 desc_fc_imperial_coronation:0 "[Root.Capital.GetCapitalName] a été choisie pour le couronnement du Conseil et ses habitants en tirent grande fierté."
 free_cities.1.d:0 "La ville de [Root.Capital.GetCapitalName] a reçu l'immédiateté du Conseil et le statut de commune libre du Conseil des Communes Libres. Même s'il existe au sein du Conseil de nombreuses et grandes cités disposant de leur propre gouvernement, [Root.GetLeLaNP] [Root.GetName] dispos[Root.GetEEntNP] désormais de toute autre chose pour se défendre que [Root.GetSaLeurNP] richesse et [Root.GetSonLeurNP] importance : [Root.GetSesLeursNP] droits commerciaux et politiques, défendus de façon perpétuelle par [Emperor.GetLeLaLDir] [Emperor.GetDir] en personne."
 free_cities.6.d:0 "[PAP.GetLeLaLDirCap] [PAP.GetDir] [PAP.Monarch.GetName] a placé les regalia du Conseil des Communes Libres entre les mains [Emperor.GetDuDelaFDir] nouv[Emperor.GetElElleFDir] [Emperor.GetDir], symbolisant le droit [PAP.GetDuDelaDir] [PAP.GetDir] à couronner les souverains chrétiens en tant que protecteur de l'Église catholique romaine. C'est un insigne honneur que d'avoir été choisis comme lieu du couronnement, et l'Église de [Root.Capital.GetCapitalName] pouvait à peine accueillir tous les dignitaires qui se sont rassemblés pour assister à la cérémonie."
 free_cities.10.d:0 "Les nobles [Root.GetRootAdjMP], propriétaires de vastes domaines, n'apprécient guère que le statut de commune libre du Conseil nous préserve de la suzeraineté envers quelque titre de noblesse, et toutes les possibilités que nous avions pour les tenir apaisés sont désormais épuisées. Auraient-ils été de simples paysans, armés de fourches et de torches, peu entraînés aux choses de la guerre, nous serions en mesure de réprimer la moindre de leur révolte ; mais ces hommes, titrés, bien dotés et formés à l'art de la guerre ne doivent pas être sous-estimés. [Emperor.GetLeLaFDirCap] seul[Emperor.GetXEDir] qu'ils pourraient encore écouter est l'[Emperor.GetEmpereurImperatriceDir] du Conseil des Communes Libres…"
 free_cities.14.d:0 "Le Conseil des Communes Libres a déjà connu de nombreuses ligues. La Ligue hanséatique, par exemple, qui réunissait des guildes de marchands au sein d'une confédération commerciale et défensive ; ou encore la Ligue de Souabe, qui était une association mutuelle de défense et de préservation de la paix. Certaines de ces ligues, parfois, étaient si puissantes et unies qu'elles en vinrent à être considérées comme un véritable État, comme la Confédération suisse.\n\nLa commune libre [From.GetDuDeNP] [From.GetName] nous suggère d'en fonder une similaire, une sorte d'accord de coopération où nous collaborerions pour tout ce qui touche au commerce, à la préservation de la paix du Conseil, ou encore au financement des tribunaux."
 fc_hre_privileges:0 "Privilèges sur les taxes et coutumes accordés par le Président"
 desc_fc_hre_privileges:0 "L'[Emperor.GetEmpereurImperatriceDir] du Conseil des Communes Libres a accordé [Root.GetAuAlaNP] [Root.GetName] des privilèges particuliers pour ce qui concerne les coutumes et les taxes."
 desc_fc_city_league:0 "Inspirées par d'anciennes ligues de cités telles que la Ligue de Souabe, la Ligue hanséatique ou la Ligue lombarde, les communes libres du Conseil des Communes Libres se sont accordées pour oeuvrer de concert et coopérer davantage sur certaines questions."
 renovatio_effect:0 "Le §YConseil des Communes Libres§! va former un seul et unique pays."
 vassalize_empire2:0 "L'ensemble des membres du §YConseil des Communes Libres§! qui soutiennent la réforme vont devenir nos vassaux directs ; ceux qui s'y opposent vont quitter le Conseil, nous offrant ainsi une revendication sur leurs territoires."
 EVTNAME1051:0 "Rejoindre le Conseil des Communes Libres."
 EVTDESC1051:0 "Les royaumes et principautés constituant le Conseil des Communes Libres au cours des siècles représentait la plus grande partie de l'Europe centrale. La taille du Conseil a évolué avec le temps, et si son organisation était assez lâche, il intégrait toujours les terres allemandes et autrichiennes."
 EVTNAME1052:0 "Quitter le Conseil des Communes Libres"
 EVTDESC1052:0 "Les querelles incessantes, politiques autant que religieuses, qui déchirent le Conseil des Communes Libres affectent le moral de la population de [Root.GetName]. Les relations avec le Président se sont dégradées à un niveau jamais vu jusque-là, et beaucoup pensent qu'il serait dans l'intérêt de [Root.GetName] de quitter le Conseil."
 EVTNAME1053:0 "Abandonner le Conseil des Communes Libres Germanique"
 EVTDESC1053:0 "Les querelles incessantes, politiques autant que religieuses, qui déchirent le Conseil des Communes Libres affectent le moral de la population de [Root.GetName]. Les relations avec le Président se sont dégradées à un niveau jamais vu jusque-là, et beaucoup pensent qu'il serait dans l'intérêt de [Root.GetName] de quitter le Conseil."
 EVTDESC759:0 "Depuis le Xe s., les archevêques de Mayence portent le titre prestigieux de Primas Germaniæ, qui fait d'eux l'archevêque catholique le plus important de tout le Conseil des Communes Libres.\n\nNaturellement, un tel titre suscite la jalousie des autres communes du Conseil… Mieux vaut donc ne pas laisser notre prestige tomber trop bas, ou le titre pourrait bien nous glisser entre les doigts."
 EVTDESC761:0 "Le titre de Primas Germaniæ, archevêque catholique le plus important du Conseil des Communes Libres, a été créé au Xe s., l'archevêché de Mayence ayant été le premier à le recevoir.\n\nLe fait qu'une puissance aussi secondaire que [From.GetLeLaNP] [From.GetName] porte un titre aussi prestigieux est un véritable affront à l'Église catholique. Ne pouvons-nous trouver un candidat qui en serait plus digne ?"
 EVTDESC2036:0 "Des rapports nous sont parvenus, affirmant que le Président planifierait de marcher contre tous les États protestants du Conseil des Communes Libres. Il serait déterminé à « nettoyer les territoires du Conseil de la racaille hérétique » avant la fin de l'année. Si nous voulons rester fidèles à notre foi, il nous faut nous préparer."
 EVTDESC96200:0 "Heureuse nouvelle ! Après que son détenteur précédent est tombé en disgrâce, [PAP.GetLeLaLDir] [PAP.GetDir] nous a élus pour porter le titre prestigieux de Primas Germaniæ, celui qui est réservé au premier des archevêques de tout le Conseil des Communes Libres !"
 EVTDESC964:0 "Le titre prestigieux de legatus natus ne peut être détenu que par un évêque catholique du Conseil des Communes Libres. Puisque nous ne remplissons plus les conditions, le pape nous a donc dépossédés de ce titre."
 EVTDESC900_01:0 "Vive [Root.GetLeLaLDir] [Root.GetDir] ! Les conseillers ont décidé de nous renouveler leur confiance, et la couronne du Conseil demeure [Root.GetAuEnNP] [Root.GetName]. À mesure que nous affermissons notre emprise sur le Conseil des Communes Libres et que les communes commencent à nous percevoir comme les détenteurs naturels du pouvoir, notre cohésion du Conseil s'accroît."
 EVTDESC901:0 "Tel le phénix renaissant de ses cendres, [From.GetLeLaNP] [From.GetName] [From.GetAOntNP] été rétabli[GetXENP] en tant qu'État membre du Conseil des Communes Libres."
 EVTDESC902:0 "[From.GetLeLaNPCap] [From.GetName], État membre du Conseil des Communes Libres, [From.GetSestSesontNP] converti[From.GetXENP] à une foi hérétique."
 EVTDESC903:0 "[From.GetLeLaNPCap] [From.GetName], État membre du Conseil des Communes Libres, [From.GetSestSesontNP] converti[From.GetXENP] à la vraie foi."
 EVTDESC904:0 "Le Conseil des Communes Libres a triomphé [From.GetDuDelaNP] [From.GetName], qui l'avai[From.GetTEntNP] traîtrement agressé."
 EVTDESC905:0 "[From.GetLeLaNPCap] [From.GetName], État membre du Conseil des Communes Libres, [From.GetAOntNP] été annexé[From.GetXENP] par une puissance étrangère."
 EVTDESC907:0 "[From.GetLeLaNPCap] [From.GetName], État membre du Conseil des Communes Libres, [From.GetAOntNP] été libéré[From.GetXENP] de [From.GetSonLeurNP] lien de dépendance envers un pays étranger."
 EVTDESC950:0 "La province de [Root.GetName] a été libérée des griffes [From.Owner.GetDuDelaNP] [From.Owner.GetName] et réintégrée dans le Conseil des Communes Libres. Notre action a été remarquée."
 EVTDESC9073:0 "En l'année de Notre Seigneur [GetYear], [Emperor.GetLeLaFDir] très serein[Emperor.GetXEDir] Auguste [Emperor.Monarch.GetName], [Emperor.GetEmpereurImperatriceDirCap] du Conseil des Communes Libres, couronné[Emperor.GetXEDir] par la grâce de Dieu, a de nouveau convoqué l'Assemblée générale du Conseil. Celle-ci a promulgué une réforme visant à centraliser l'ensemble des décisions regardant la politique étrangère et la guerre ; chaque État membre devient en conséquence un vassal direct [Emperor.GetDuDelaNP] [Emperor.GetName]."
 EVTDESC9074:0 "La réforme a été acceptée par l'Assemblée générale du Conseil, et l'indépendance [Root.GetDuDelaNP] [Root.GetName] appartient désormais au passé. Le seul choix qu'il nous reste est soit de nous soumettre à l'[Emperor.GetEmpereurImperatriceDirCap], soit de nous détourner du Conseil des Communes Libres et d'affronter [Emperor.Monarch.GetName] sur les champs de bataille."
 EVTDESC9075:0 "En l'année de Notre Seigneur [GetYear], [Emperor.GetLeLaFDir] très serein[Emperor.GetXEDir] Auguste [Emperor.Monarch.GetName], Imperator Romanorum, couronné[Emperor.GetXEDir] par la grâce de Dieu, a de nouveau convoqué l'Assemblée générale du Conseil . Celle-ci a promulgué une réforme visant à unir l'ensemble des innombrables États membres du Conseil en un seul État, et à faire de la famille des [Emperor.Monarch.Dynasty.GetName] [Emperor.GetDuDeNP] [Emperor.GetName] les possesseurs héréditaires de la Couronne."
 hre_core_tt:0 "[Root.GetLeLaNPCap] §Y[Root.GetName]§! v[Root.GetAOntNP] recevoir la légitimité sur toutes les provinces relevant du Conseil des Communes Libres n'étant PAS possédées par un membre du Conseil."
 hre_inheritance_tt:0 "Tous les pays membres du §YConseil des Communes Libres§! vont se voir proposer d'intégrer [Root.GetLeLaNP] §Y[Root.GetName]§!."
 desc_great_peasants_war_triggered_modifier:0 "La guerre des paysans plonge le Conseil des Communes Libres dans un conflit sanglant. Tant que celui-ci ne sera pas terminé, les paysans révoltés seront enhardis au point de ne pas rechigner à renverser le gouvernement."
 incident_switzerland.1.t:0 "La Suisse et le Conseil"
 incident_switzerland.1.d:0 "Maintenant que les grands conflits de religion sont terminés, qui ont bouleversé non seulement le Conseil mais aussi une bonne partie de l'Europe, les cantons suisses envisagent sous un jour nouveau la relation de plus en plus distante avec le Conseil des Communes Libres. Si les Suisses ayant combattu et péri pour ramener la paix sont nombreux, les termes des traités de paix ne sont guère au goût de leurs dirigeants, et déjà bon nombre de notables en appellent à une sécession officielle et totale d'avec le Conseil."
 incident_switzerland.1.b:0 "La Suisse est et restera au sein du Conseil"
 incident_switzerland.2.t:0 "La Suisse et le Conseil"
 incident_switzerland.2.d:0 "La Suisse a quitté le Conseil ! Mécontents de la paix religieuse et enhardis par l'affaiblissement des institutions du Conseil, ses habitants ont décidé qu'appartenir au Conseil n'était plus dans leur intérêt."
 incident_switzerland.2.a:0 "Le Conseil, on l'aime ou on le quitte !"
 incident_switzerland.2.b:0 "L'appartenance au Conseil n'est pas une question de choix"
 desc_pope_in_hre_triggered_modifier:0 "La papauté a intégré le Conseil des Communes Libres, ce qui a de graves conséquences pour tous les pays catholiques hors du Conseil."
 incident_pope.1.d:0 "L'Italie n'est plus ce « royaume fantôme » de jadis depuis qu'elle est rentrée dans le giron du Conseil des Communes Libres, grâce aux efforts incessants des présidents. La papauté doit désormais choisir si elle doit reconnaître l'hégémonie du Conseil ou être condamnée à rester faible et vulnérable à ses frontières.\n\nAccepter l'autorité de l'[Emperor.GetEmpereurImperatriceDirCap] aurait des répercussions pour le moins regrettables pour la Chrétienté : tandis même que les catholiques du Conseil pourraient voir leur foi réaffirmée si le patrimoine de Saint Pierre l'intégrait, ceux se trouvant en dehors ne verraient certainement pas d'un bon oeil une telle décision et pourraient se laisser tenter par les hérésies…"
 incident_pope.1.a:0 "Mieux vaut intégrer le Conseil"
 incident_pope.2.d:0 "L'Italie n'est plus ce « royaume fantôme » de jadis depuis qu'elle est rentrée dans le giron du Conseil des Communes Libres, grâce aux efforts incessants des présidents. [PAP.GetLeLaLDirCap] [PAP.GetDir], à Rome, a [PAP.GetLuiElleDir] aussi fait le choix de reconnaître l'hégémonie du Conseil plutôt qu'être condamné[PAP.GetXEDir] à rester faible et vulnérable à nos frontières.\n\nMais faire [PAP.GetDuDelaDir] [PAP.GetDir] un[PAP.GetXEDir] [PAP.GetPrincePrincesseDir] du Conseil aurait des répercussions dans l'ensemble de la Chrétienté : tandis même que les catholiques du Conseil pourraient voir leur foi réaffirmée si le patrimoine de Saint Pierre l'intégrait, ceux se trouvant en dehors ne verraient certainement pas d'un bon oeil une telle décision et pourraient se laisser davantage tenter par les hérésies…"
 incident_pope.2.a:0 "Accueillons [PAP.GetLeLaLDir] [PAP.GetDir] au sein du Conseil"
 incident_pope.3.t:0 "Désacralisation du Conseil"
 incident_pope.3.d:0 "L'Assemblée générale du Conseil s'est entendue pour promulguer un édit aussi terrible qu'intolérable : la religion officielle du Conseil des Communes Libres n'est désormais plus le catholicisme. Tous nos efforts pour restaurer la dignité de notre Sainte Mère l'Église ont été réduits à néant, aussi devrions-nous désormais envisager d'abandonner à son sort cette institution moribonde qu'est ce « saint » Empire."
 num_imperial_regalia:0 "Regalia du Conseil"
 num_imperial_regalia_desc:0 "En 1423, Nuremberg s'est vu confier par le Président Sigismond, à perpétuité, les joyaux de la couronne du Conseil. Maintenant qu'ils sont arrivés dans notre cité, transportés en grand secret dans des tonneaux de poisson pour empêcher qu'ils ne soient volés, montrons au monde l'importance et la gloire éternelle de Nuremberg !"
 HLR_ideas:0 "Doctrines du Conseil des Communes Libres"
 HLR_ideas_start:0 "traditions du Conseil des Communes Libres"
 HLR_ideas_bonus:0 "ambitions du Conseil des Communes Libres"
 hlr_imperial_throne:0 "Trône du Conseil"
 hlr_imperial_throne_desc:0 "Charlemagne a été couronné « Président des Romains » par le pape Léon en l'an 800, fondant ainsi la longue lignée des présidents à laquelle nous nous rattachons. Depuis cette époque ancienne, de nombreux hommes de grande valeur et très sages se sont assis sur le trône du Conseil."
 hlr_imperial_diplomacy:0 "Diplomatie du Conseil"
 hlr_imperial_diplomacy_desc:0 "L'expertise de nos diplomates est sans équivalent. Le Conseil des Communes Libres a eu des sujets très nombreux et très divers au cours des siècles, ce qui a permis à nos ambassadeurs et émissaires de perfectionner leurs connaissances et leurs pratiques, qu'ils se sont transmises de génération en génération."
 hlr_centralised_empire_desc:0 "L'unification du Conseil a aussi entraîné une centralisation croissante. Cela a amoindri la puissance des dirigeants locaux, nous permettant de rediriger leurs richesses vers nos propres coffres."
 hlr_roman_heritage_desc:0 "Le Conseil des Communes Libres se prétend l'héritier d'une histoire remontant à Auguste, le premier président de Rome. Maintenant que les territoires allemands sont unifiés au sein d'un seul État, puissant et centralisé, l'heure est venue de tout faire pour restaurer la gloire ancienne de Rome en réunissant tous les territoires qu'elle dominait autrefois."
 incident_generic.1.t:0 "Demande d'intégration dans le Conseil"
 incident_generic.1.d:0 "Il est certes rare que le Conseil des Communes Libres s'étende au-delà de ses frontières, mais rien dans ses lois ne semble l'interdire. Or, cela fait quelque temps désormais que [Root.GetLeLaNP] [Root.GetName] [Root.GetEstSontNP] suzerain[Root.GetXENP] [pu_hre_country.GetDuDelaNP] [pu_hre_country.GetName], aussi pourrions-nous envisager de défendre [pu_hre_country.GetSaLeurNP] demande d'intégrer le Conseil."
 incident_generic.2.t:0 "Demande d'entrée dans le Conseil"
 incident_generic.2.d:0 "Il est certes rare que le Conseil des Communes Libres s'étende au-delà de ses frontières, mais rien dans ses lois ne semble l'interdire. Or, cela fait quelque temps désormais que [current_pu_incident_target.Overlord.GetLeLaNP] [current_pu_incident_target.Overlord.GetName] demand[current_pu_incident_target.Overlord.GetEEntNP] à l'[Emperor.GetEmpereurImperatriceDirCap] d'accepter l'entrée [current_pu_incident_target.GetDuDelaNP] [current_pu_incident_target.GetName] dans le Conseil, qu'[current_pu_incident_target.Overlord.GetIlElleNP] dirig[current_pu_incident_target.Overlord.GetEEntNP] dans le cadre d'une union personnelle."
 incident_generic.2.a:0 "[current_pu_incident_target.GetLeLaNPCap] [current_pu_incident_target.GetName] devrai[current_pu_incident_target.GetTEntNP] intégrer le Conseil"
 incident_holstein_member_alert:0 "Si le Holstein s'est longtemps trouvé placé sous la suzeraineté des rois scandinaves, il se trouve désormais pleinement incorporé au sein [holstein_owner.GetDuDelaNP] [holstein_owner.GetName]. Mais si le Conseil des Communes Libres acceptait de voir le duché ainsi gouverné, il demeure néanmoins légalement territoire du Conseil, et en aucun cas une simple province [holstein_owner.GetAdjective]."
 incident_holstein_emperor_alert:0 "Si le Holstein s'est longtemps trouvé placé sous la suzeraineté des rois scandinaves, il se trouve désormais pleinement incorporé au sein [holstein_owner.GetDuDelaNP] [holstein_owner.GetName]. Mais si le Conseil des Communes Libres acceptait de voir le duché ainsi gouverné, il demeure néanmoins légalement territoire du Conseil, et en aucun cas une simple province [holstein_owner.GetAdjective]."
 opinion_emperor_imperial_embargo:0 "A décrété un embargo du Conseil"
 shadow_kingdom.2.d:0 "Si le royaume d'Italie relève toujours officiellement du Conseil des Communes Libres, il est dans les faits devenu un « royaume fantôme ». Les États italiens agissent en toute indépendance de l'[Emperor.GetEmpereurImperatriceDirCap], et les échecs successifs des titulaires du titre de Président à restaurer leur autorité sur la région ont laissé des pans de territoires sous le contrôle de potentats qui refusent de reconnaître toute cohésion du Conseil.\n\nLa question désormais pour les Italiens est donc de savoir pour quelle raison ils devraient même reconnaître la suzeraineté de [Emperor.Monarch.GetName] [Emperor.Monarch.Dynasty.GetName]."
 shadow_kingdom_emperor_gives_up_tt:0 "Les États italiens se trouvant au sein du Conseil et ayant été placés sous contrôle §Yresteront§! dans le Conseil.\nCeux qui n'auront pas été placés sous contrôle en §Ysortiront§!.\n\n§YL'[Emperor.GetEmpereurImperatriceDirCap] va perdre §R0.2§! en cohésion du Conseil par niveau de développement de chaque province sortant du Conseil.§!"
 shadow_kingdom_incident_tt:0 "L'[Emperor.GetEmpereurImperatriceDirCap] a jusqu'à §Y1490§! pour réaffirmer son autorité sur les États italiens membres du Conseil."
 shadow_kingdom_incident_penalty_tt:0 "§R-0.2§! en cohésion du Conseil par point de §Ydéveloppement§! dans les provinces italiennes quittant le §YConseil des Communes Libres§!."
 incident_king_in_prussia_member_alert:0 "La Prusse est une puissance en pleine ascension au sein du Conseil des Communes Libres, dominant de plus en plus largement la scène politique du Conseil, et se faisant même une place sur la scène internationale. [PRU.GetLeLaLDirCap] [PRU.GetDir] [PRU.Monarch.GetName] a donc annoncé son intention de créer un royaume de Prusse. Il n'y a que très peu de précédents au sein du Conseil, aussi l'[Emperor.GetEmpereurImperatriceDirCap] doit-[Emperor.GetIlElleDir] considérer avec attention cette question."
 incident_king_in_prussia_emperor_alert:0 "La Prusse est une puissance en pleine ascension au sein du Conseil des Communes Libres, dominant de plus en plus largement la scène politique du Conseil, et se faisant même une place sur la scène internationale. [PRU.GetLeLaLDirCap] [PRU.GetDir] [PRU.Monarch.GetName] a donc annoncé son intention de créer un royaume de Prusse. Il n'y a que très peu de précédents au sein du Conseil, aussi l'[Emperor.GetEmpereurImperatriceDirCap] doit-[Emperor.GetIlElleDir] considérer avec attention cette question."
 incident_switzerland:0 "La Suisse et le Conseil"
 incident_switzerland_member_alert:0 "La Suisse a quitté le Conseil ! Mécontents de la paix religieuse et enhardis par l'affaiblissement des institutions du Conseil, ses habitants ont décidé qu'appartenir au Conseil n'était plus dans leur intérêt."
 incident_switzerland_emperor_alert:0 "La Suisse a quitté le Conseil ! Mécontents de la paix religieuse et enhardis par l'affaiblissement des institutions du Conseil, ses habitants ont décidé qu'appartenir au Conseil n'était plus dans leur intérêt."
 emperor_loses_claims_tt:0 "L'[Emperor.GetEmpereurImperatriceDirCap] va renoncer à toute revendication §Ydu Conseil§! sur les territoires §Ysuisses§!."
 incident_pope:0 "Le pape et le Président"
 incident_pope_member_alert:0 "Maintenant que l'Italie est de nouveau un bastion de la cohésion du Conseil, [PAP.GetLeLaLDir] [PAP.GetDir] a demandé à devenir [PAP.GetPrincePrincesseDir] du Conseil des Communes Libres. Cela aurait toutefois des conséquences importantes pour la Chrétienté : tandis même que les catholiques du Conseil pourraient voir leur foi réaffirmée si le patrimoine de Saint Pierre l'intégrait, ceux se trouvant en dehors ne verraient certainement pas d'un bon oeil une telle décision et pourraient se laisser tenter par les hérésies."
 incident_pope_emperor_alert:0 "Maintenant que l'Italie est de nouveau un bastion de la cohésion du Conseil, [PAP.GetLeLaLDir] [PAP.GetDir] a demandé à devenir [PAP.GetPrincePrincesseDir] du Conseil des Communes Libres. Cela aurait toutefois des conséquences importantes pour la Chrétienté : tandis même que les catholiques du Conseil pourraient voir leur foi réaffirmée si le patrimoine de Saint Pierre l'intégrait, ceux se trouvant en dehors ne verraient certainement pas d'un bon oeil une telle décision et pourraient se laisser tenter par les hérésies."
 imperial_diplomacy_reform:0 "Diplomatie du Conseil"
 imperial_diplomacy_reform_desc:0 "La cité ne peut préserver son indépendance sans le soutien du Président et de ses alliés. Nous devons donc tout faire pour conserver des liens diplomatiques étroits afin que, dès que nous avons besoin d'eux, nos amis volent à notre secours pour nous sauver."
 emperor_reichsstabilitaet_desc:0 "Préserve la stabilité du Conseil tout en assurant les moyens de son expansion."
 emperor_perpetual_diet_title:0 "Instituer l'Assemblée générale du Conseil perpétuelle"
 emperor_landsknechtswesen_desc:0 "Organise les nombreuses bandes de mercenaires allemands au sein d'unités officielles, destinées à défendre le Conseil."
 emperor_reichstag_collegia_desc:0 "Afin d'améliorer son fonctionnement général, divise l'Assemblée générale du Conseil en divers collèges bien distincts, distinguant entre conseillers, communes divers et villes du Conseil."
 emperor_geteilte_macht_desc:0 "Garantit les pouvoirs des communes du Conseil, de manière à ce qu'ils puissent à leur tour soutenir le Président."
 emperor_rechenschaft_desc:0 "Développe les mesures de contrôle et d'équilibre dans le Conseil afin d'instaurer un système plus équitable."
 emperor_expand_gemeiner_pfennig_desc:0 "Augmente l'impôt du Gemeiner Pfennig afin d'accroître les capacités du Conseil en temps de guerre."
 emperor_reichskrieg_desc:0 "Permet de mobiliser les forces du Conseil pour faire face à quiconque oserait le menacer."
 emperor_imperial_estates_desc:0 "Restreint les droits des collèges de l'Assemblée générale du Conseil de manière à les empêcher de s'élever contre la volonté du Président."
 opinion_imperial_diplomacy:0 "Diplomatie du Conseil"
 emperor_perpetual_diet_emperor:0 "Assemblée générale du Conseil perpétuelle"
 emperor_expand_gemeiner_pfennig_elector_per_prince:0 "Gemeiner Pfennig par commune"
 emperor_expand_gemeiner_pfennig_emperor_per_prince:0 "Gemeiner Pfennig par commune"
 emperor_imperial_estates_emperor:0 "Collèges de l'Assemblée générale du Conseil freinés"
 incident_hungary_mission_emperor_alert:0 "Ayant uni en la personne d'un monarque unique les couronnes de Hongrie et de Bohême, les Hongrois ont demandé à [Emperor.Monarch.GetName] [Emperor.GetDuDeNP] [Emperor.GetName] d'accepter, en sa qualité d'[Emperor.GetEmpereurImperatriceDirCap] du Conseil des Communes Libres, de les intégrer dans celui-ci. Ils insistent par ailleurs sur le fait que, la Bohême étant désormais une part d'un ensemble plus vaste, son siège leur soit officiellement transmis."
 incident_hungary_mission_member_alert:0 "Ayant uni en la personne d'un monarque unique les couronnes de Hongrie et de Bohême, les Hongrois ont demandé à [Emperor.Monarch.GetName] [Emperor.GetDuDeNP] [Emperor.GetName] d'accepter, en sa qualité d'[Emperor.GetEmpereurImperatriceDirCap] du Conseil des Communes Libres, de les intégrer dans celui-ci. Ils insistent par ailleurs sur le fait que, la Bohême étant désormais une part d'un ensemble plus vaste, son siège leur soit officiellement transmis."
 incident_reformer_dissension_can_happen_tt:0 "Du fait qu'ils contrôlent la majorité des provinces au sein du Conseil, les §Yprinces réformés§! s'opposent à cela."
 incident_reformer_dissension_emperor_alert:0 "Les communes du Conseil de confession réformée sont atterrés que tous leurs efforts pour contrecarrer les catholiques aient permis [Emperor.GetAuAlaFDir] nouv[Emperor.GetElElleFDir] [Emperor.GetEmpereurImperatriceDirCap] de faire du protestantisme la foi officielle du Conseil des Communes Libres. Ils sont de fait en majorité au sein du Conseil. Menés par [reformed_leader_country.GetLeLaLDir] [reformed_leader_country.GetDir] [reformed_leader_country.Monarch.GetName] [reformed_leader_country.GetDuDeNP] [reformed_leader_country.GetName], ils ont donc approché [Emperor.Monarch.GetName] pour lui demander que la Réforme, à défaut de recevoir la préséance, soit au moins placée sur un pied d'égalité avec le protestantisme."
 incident_reformer_dissension_member_alert:0 "Les communes du Conseil de confession réformée sont atterrés que tous leurs efforts pour contrecarrer les catholiques aient permis [Emperor.GetAuAlaFDir] nouv[Emperor.GetElElleFDir] [Emperor.GetEmpereurImperatriceDirCap] de faire du protestantisme la foi officielle du Conseil des Communes Libres. Ils sont de fait en majorité au sein du Conseil. Menés par [reformed_leader_country.GetLeLaLDir] [reformed_leader_country.GetDir] [reformed_leader_country.Monarch.GetName] [reformed_leader_country.GetDuDeNP] [reformed_leader_country.GetName], ils ont donc approché [Emperor.Monarch.GetName] pour lui demander que la Réforme, à défaut de recevoir la préséance, soit au moins placée sur un pied d'égalité avec le protestantisme."
 desc_hre_dominant_reformed:0 "La foi réformée est la religion officielle au sein du Conseil des Communes Libres. Tout pays pratiquant cette foi bénéficie donc d'un surcroît de légitimité morale."
 incidents_bur_inheritance.1.desc:0 "La situation que nous redoutions tant a fini par se produire. Le duc est mort sans héritier mâle pour lui succéder. Avec son trépas, c'est [Root.Monarch.GetName] qui est désormais [Root.GetDir] de Bourgogne. Mais ses prétentions sur le trône sont peu assurées aux yeux de nombreux nobles, et la Bourgogne semble toute prête de tomber dans l'escarcelle de l'ambiti[FRA.GetEuxEuseDir] [FRA.GetDir] de France ou de [Emperor.Monarch.GetName] du Conseil des Communes Libres.\n\n[Root.Monarch.GetName] est un[Root.GetXEDir] [Root.Monarch.GetWomanMan] courag[Root.GetEuxEuseDir] et intelligent[Root.GetXEDir], mais si la Bourgogne doit survivre à la crise sans entrer en conflit avec l'une des deux grandes puissances, [Root.GetIlElleDir] va devoir épouser un[Root.GetAntiXEDir] membre d'une famille royale prestigieuse afin de bénéficier de son soutien et de sa protection. Bien évidemment, le mariage sera patrilinéaire, comme le veut la coutume, aussi la Bourgogne perdra-t-elle sa souveraineté au profit d'une puissance étrangère ; mais en cette période de grandes incertitudes, il n'y a guère d'autre choix qui s'offre à nous."
 incidents_bur_inheritance.1.c:0 "Un commune [Emperor.Monarch.Dynasty.GetName] serait parfait"
 incidents_bur_inheritance.101.d.indi:0 "En dépit de nos prétentions légitimes sur la Bourgogne, [BUR.GetLeLaLDir] [BUR.GetDir] [BUR.Monarch.GetName] a refusé de faire la moindre concession et s'est déclaré[BUR.GetXEDir] indépendant[BUR.GetXEDir] de toute autorité étrangère. Cela est assez inattendu, car les [BUR.Monarch.Dynasty.GetName] n'ont produit aucun héritier mâle, aussi la Bourgogne était-elle censée repasser sous souveraineté française, les Pays-Bas revenant eux au Conseil. Cette situation nouvelle pourrait, cependant, nous fournir le prétexte tout trouvé pour revendiquer la Bourgogne et mettre ainsi fin au règne illégitime de [BUR.Monarch.GetName]."
 incidents_bur_inheritance.102.d:0 "Avec la mort du duc, les réformes qu'il avait promulguées afin de permettre l'intégration des Pays-Bas au sein [Root.GetDuDelaNP] [Root.GetName] nous posent aujourd'hui problème. [Emperor.GetLeLaLDirCap] [Emperor.GetDir] [Emperor.Monarch.GetName] vient de nous dépêcher un envoyé pour exiger que ces possessions soient séparées du duché de Bourgogne et retrouvent leur statut de principauté du Conseil des Communes Libres.\n\nFort heureusement, [Root.Monarch.GetName] est rusé[Root.GetXEDir] et sage, et [Root.GetIlElleDir] a proposé de révoquer ces réformes pour introduire un « Grand Privilège des Pays de Par-deçà », qui permettrait d'imposer à toutes les cités de la région de reconnaître la souveraineté de la Bourgogne tout en restant loyales au Conseil des Communes Libres. Cela pourrait évidemment se retourner contre nous, et l'[Emperor.GetEmpereurImperatriceDirCap] pourrait user de ce prétexte pour nous pousser à la guerre ; mais il y a aussi une chance qu'[Emperor.GetIlElleDir] se satisfasse d'un tel compromis."
 incidents_bur_inheritance.102.c.tt:0 "Toutes les dépendances [BUR.GetDuDelaNP] §Y[BUR.GetName]§! dont la capitale se trouve dans les §YPays-Bas§! vont accéder à l'indépendance et intégrer le §YConseil des Communes Libres§!."
 incidents_bur_inheritance.103.d.emp:0 "Avec la mort du duc de Bourgogne, nos liens royaux avec sa famille ont porté leurs fruits. Plusieurs de leurs possessions relèvent déjà du Conseil des Communes Libres, et Marie a décidé d'intégrer pleinement le Conseil en offrant d'épouser un commune [Root.Monarch.Dynasty.GetName]. [FRA.GetLeLaLDirCap] [FRA.GetDir] de France, pour sa part, s'attend à voir les possessions bourguignonnes revenir sous sa souveraineté, mais nous sommes désormais en mesure de nous opposer à ses revendications et de conserver la Bourgogne au sein du Conseil."
 incidents_bur_inheritance.104.d:0 "La réponse [BUR.GetDuDelaDir] [BUR.GetDir] de Bourgogne n'est pas du tout celle que nous avions envisagée. [BUR.GetIlElleDirCap] a choisi de ne pas nous rétrocéder les terres qu'[BUR.GetIlElleDir] détient de façon illégitime aux Pays-Bas et qui relèvent du Conseil des Communes Libres, mais en même temps introduit une loi complexe qui impose aux Pays-Bas de rester membres du Conseil tout en étant sujets de la Bourgogne.\n\nNous avons donc les mains liées. Si nous choisissons d'intervenir, la réputation de l'[Emperor.GetEmpereurImperatriceDirCap] sera entachée ; mais si nous n'agissons pas nous risquons bel et bien de perdre à tout jamais les Pays-Bas…"
 incidents_bur_inheritance.104.b:0 "Au Diable les lois, la Bourgogne sort du Conseil !"
 incidents_bur_inheritance.2.d:0 "Avec la mort du duc, les liens de la Bourgogne avec le Conseil des Communes Libres ont porté leurs fruits. Plusieurs possessions bourguignonnes relèvent déjà de celui-ci, et Marie a décidé d'intégrer pleinement le Conseil en offrant d'épouser un commune [Emperor.Monarch.Dynasty.GetName]. [FRA.GetLeLaLDirCap] [FRA.GetDir] de France, pour sa part, s'attend à voir les possessions bourguignonnes revenir sous sa souveraineté, mais l'[Emperor.GetEmpereurImperatriceDir] [Emperor.Monarch.GetName] est désormais en mesure de s'opposer à ces revendications et de conserver la Bourgogne au sein du Conseil."
 incidents_bur_inheritance.2.c:0 "Intégrons l'ensemble de la Bourgogne dans le Conseil"
 incidents_bur_inheritance.3.d:0 "La mort du duc de Bourgogne risque bien de faire passer les Pays-Bas hors de notre autorité. Si nous souhaitons renforcer le Conseil et conserver les puissances étrangères hors des affaires du Conseil, nous devons immédiatement avancer nos revendications sur les Pays-Bas. Dans le cas contraire, il est presque assuré qu'ils nous échapperont définitivement."
 incidents_bur_inheritance.301.d:0 "En héritant de la Bourgogne, [Root.GetLeLaLDir] [Root.GetDir] [Root.Monarch.GetName] est aussi devenu[Root.GetXEDir] souverain[Root.GetXEDir] des possessions bourguignonnes aux Pays-Bas. Or, ces territoires appartiennent traditionnellement au Conseil des Communes Libres, aussi n'est-il guère surprenant que l'héritage bourguignon pousse l'[Emperor.GetEmpereurImperatriceDir] [Emperor.Monarch.GetName] à les exiger de nous.\n\nNous pouvons bien évidemment refuser de répondre à ces exigences, mais l'[Emperor.GetEmpereurImperatriceDirCap] a clairement indiqué que cela serait pour [Emperor.GetLuiElleDir] un motif suffisant pour faire entrer en guerre l'ensemble du Conseil contre [Root.GetLeLaNP] [Root.GetName]."
 incidents_bur_inheritance.302.d:0 "L'héritage bourguignon suscite bien des jalousies. Aussi, lorsque nous en avons bénéficié, il était à prévoir que l'[Emperor.GetEmpereurImperatriceDir] [Emperor.Monarch.GetName] fasse valoir ses droits traditionnels sur les Pays-Bas. Ce qui n'était pas prévisible, en revanche, était qu'[Emperor.GetIlElleDir] exigerait non pas les seuls Pays-Bas, mais bien l'ensemble de la Bourgogne… [Emperor.GetIlElleDirCap] a clairement indiqué que, pour [Emperor.GetLuiElleDir], la paix n'était en aucun cas possible si [Root.GetLeLaNP] [Root.GetName] s'avisai[Root.GetTEntNP] de refuser que l'ensemble de la Bourgogne passe dans le Conseil."
 incidents_bur_inheritance.4.d:0 "En dépit de nos prétentions légitimes sur la Bourgogne, [BUR.GetLeLaLDir] [BUR.GetDir] [BUR.Monarch.GetName] a refusé de faire la moindre concession et s'est déclaré[BUR.GetXEDir] indépendant[BUR.GetXEDir] de toute autorité étrangère. Cela est assez inattendu, car les [BUR.Monarch.Dynasty.GetName] n'ont produit aucun héritier mâle, aussi la Bourgogne était-elle censée repasser sous souveraineté française, les Pays-Bas revenant eux au Conseil. Cette situation nouvelle pourrait, cependant, nous fournir le prétexte tout trouvé pour revendiquer la Bourgogne et mettre ainsi fin au règne illégitime de [BUR.Monarch.GetName]."
 incidents_bur_inheritance.501.d:0 "Une bien triste nouvelle est arrivée aujourd'hui à [Root.Capital.GetCapitalName] : la bien-aimée duchesse de Bourgogne, Marie, vient de trépasser. Douce et tendre, épouse aimante, elle sera grandement regrettée à la cour. Cavalière passionnée, accompagnant souvent son époux lors de ses chasses, ni son amour ni sa passion de la monte n'ont pu la sauver lorsque son cheval est tombé sur elle, lui brisant le dos.\n\nLe mariage entre un commune [Root.Monarch.Dynasty.GetName] et la duchesse a uni nos deux pays ; mais maintenant que Marie est décédée nul ne peut contester notre revendication sur le duché, et déjà les nobles bourguignons ont commencé à prêter [Root.GetAuAlaDir] [Root.GetDir] [Root.Monarch.GetName] le serment de fidélité, [Root.GetLeLaFDir] reconnaissant ainsi comme leur nouv[Root.GetEauElleFDir] suzerain[Root.GetXEDir]."
 incidents_bur_join_empire.1.t:0 "Entrée dans le Conseil"
 incidents_bur_join_empire.1.desc:0 "La Bourgogne trouve ses origines dans les possessions de la famille de Bourgogne, qui s'est détournée du royaume de France en revendiquant le trône de tous les Francs. Jusqu'à présent, nous n'avons pas avancé nos revendications sur la couronne de France en tant que telle, aussi nos revendications sont-elles en partie oubliées. L'idée même que nous puissions être une nation indépendante depuis toujours est sujet de plaisanterie chez de nombreux nobles hors de nos frontières, aussi le Conseil a-t-il suggéré [Root.GetAuAlaDir] [Root.GetDir] de chercher à entrer dans le Conseil des Communes Libres et de s'incliner devant l'[Emperor.GetEmpereurImperatriceDir] [Emperor.Monarch.GetName] [Emperor.GetDuDeNP] [Emperor.GetName] pour être fait[Root.GetXEDir] [Root.GetPrincePrincesseDir] du Conseil.\n\nDe fait, l'avenir de la Bourgogne au sein du Conseil serait dès lors assuré, et peut-être même pourrait-elle un jour prétendre au titre de Président…"
 incidents_bur_join_empire.2.t:0 "La Bourgogne demande à entrer dans le Conseil"
 incidents_bur_join_empire.2.desc:0 "[BUR.GetLeLaLDirCap] [BUR.GetDir] [BUR.Monarch.GetName] a fait part de son souhait de voir la Bourgogne intégrer le Conseil des Communes Libres. Mais si la décision peut sembler facile à prendre, le fait d'avoir un[BUR.GetXEDir] [BUR.GetPrincePrincesseDir] du Conseil à la tête de ces territoires recèle de nombreux dangers.\n\nDe fait, il serait difficile de résister à l'expansion permanente de la Bourgogne au sein du Conseil, et les conseillers pourraient commencer à voir en [BUR.Monarch.GetName] un[BUR.GetXEDir] candidat[BUR.GetXEDir] séri[BUR.GetEuxEuseDir] au titre de Président. Mais, malgré tout, l'intégration de la Bourgogne au sein du Conseil permettrait d'apaiser les tensions entre le trône et ces territoires, et offrirait une occasion unique d'étendre l'influence du Conseil en France."
 incidents_bur_join_empire.2.a:0 "Accueillons donc la Bourgogne dans le Conseil"
 incidents_bur_join_empire.3.desc:0 "[Emperor.GetLeLaLDirCap] [Emperor.GetDir] a décidé d'autoriser l'entrée [Root.GetDuDelaNP] [Root.GetName] dans le Conseil à une condition : nous devons renoncer à tous nos titres en dehors du duché et de ses possessions d'outre-mer. Cela signifie, en clair, que tout territoire [Root.GetRootAdjMS] qui n'est pas considéré comme appartenant de manière légitime au duché de Bourgogne devra recevoir l'indépendance en tant que territoire du Conseil, ce qui réduira évidemment l'extension de nos possessions.\n\nCertains membres à la cour voient cela comme une véritable insulte, tandis que d'autres insistent sur le fait que [Emperor.GetLeLaLDir] [Emperor.GetDir] est encore notre meilleure garantie de protection…"
 incidents_bur_join_empire.3.b:0 "Le Conseil ne vaut en aucun cas de payer ce prix"
 incidents_bur_join_empire.4.t:0 "L'[Emperor.GetEmpereurImperatriceDirCap] refuse notre entrée dans le Conseil"
 incidents_bur_join_empire.4.desc:0 "Au prétexte que la Bourgogne serait une menace pour l'indépendance des autres communes du Conseil, [Emperor.Monarch.GetName] a refusé son entrée dans le Conseil des Communes Libres. Tout cela démontre fort clairement que [Emperor.GetLeLaLDir] [Emperor.GetDir] [Emperor.GetDuDeNP] [Emperor.GetName] n'est pas davantage qu'une vipère lovée autour de la couronne du Conseil, tremblant à l'idée que les lions de Bourgogne puissent la lui prendre.\n\nMais qu'importe. Nous présenterons plus tard une demande plus « vigoureuse » pour entrer dans le Conseil."
 incident_burgundian_succ_emp_emperor_alert:0 "L'[Emperor.GetEmpereurImperatriceDir] [Emperor.Monarch.GetName] a hérité de la Bourgogne et doit maintenant décider des liens que celle-ci doit entretenir désormais avec le Conseil, ainsi que de la réaction à adopter à l'égard de la France."
 incident_burgundian_succ_emp_member_alert:0 "L'[Emperor.GetEmpereurImperatriceDir] [Emperor.Monarch.GetName] a hérité de la Bourgogne et doit maintenant décider des liens que celle-ci doit entretenir désormais avec le Conseil, ainsi que de la réaction à adopter à l'égard de la France."
 incident_burgundian_succ_alone_emperor_alert:0 "Les Bourguignons ont rompu avec la tradition en plaçant une femme sur le trône. Nous devons mettre un terme à son règne et réintégrer les Pays-Bas dans le Conseil des Communes Libres."
 incident_burgundian_succ_alone_member_alert:0 "Les Bourguignons ont rompu avec la tradition en plaçant une femme sur le trône. L'[Emperor.GetEmpereurImperatriceDirCap] doit mettre un terme à ce règne et réintégrer les Pays-Bas dans le Conseil des Communes Libres."
 incident_burgundy_wants_to_join_emperor_alert:0 "[BUR.GetLeLaLDirCap] [BUR.GetDir] de Bourgogne veut entrer dans le Conseil."
 incident_burgundy_wants_to_join_member_alert:0 "[BUR.GetLeLaLDirCap] [BUR.GetDir] de Bourgogne veut entrer dans le Conseil."
 incident_burgundy_wants_to_join:0 "La Bourgogne et le Conseil"
 incident_pu_subject_joins_empire:0 "Demande d'intégration dans le Conseil"
 incident_pu_subject_joins_empire_member_alert:0 "Il est assez rare que le Conseil des Communes Libres s'étende, mais rien dans les lois du Conseil ne semble s'y opposer. Or, [current_pu_incident_target.Overlord.GetLeLaLDir] [current_pu_incident_target.Overlord.GetDir] [current_pu_incident_target.Overlord.GetDuDeNP] [current_pu_incident_target.Overlord.GetName] a demandé à l'[Emperor.GetEmpereurImperatriceDirCap] de considérer l'entrée dans le Conseil [current_pu_incident_target.GetDuDelaNP] [current_pu_incident_target.GetName], qu'[current_pu_incident_target.Overlord.GetIlElleDir] gouverne dans le cadre d'une union personnelle."
 incident_pu_subject_joins_empire_emperor_alert:0 "Il est assez rare que le Conseil des Communes Libres s'étende, mais rien dans les lois du Conseil ne semble s'y opposer. Or, [current_pu_incident_target.Overlord.GetLeLaLDir] [current_pu_incident_target.Overlord.GetDir] [current_pu_incident_target.Overlord.GetDuDeNP] [current_pu_incident_target.Overlord.GetName] a demandé à l'[Emperor.GetEmpereurImperatriceDirCap] de considérer l'entrée dans le Conseil [current_pu_incident_target.GetDuDelaNP] [current_pu_incident_target.GetName], qu'[current_pu_incident_target.Overlord.GetIlElleDir] gouverne dans le cadre d'une union personnelle."
 opinion_added_pu_subject_hre:0 "A intégré notre dépendance dans le Conseil"
 opinion_denied_pu_subject_hre:0 "A refusé d'intégrer notre dépendance dans le Conseil"
 desc_great_peasants_war_concessions_triggered_modifier:0 "La guerre des paysans a contraint le Conseil des Communes Libres à réévaluer les droits de la paysannerie. Un certain nombre de concessions lui ont été accordées et des droits anciens garantis, ce qui permet de tirer moins de revenus de son travail dans les champs."
 incident_great_peasants_war_member_alert:0 "Les conflits violents entre paysans et seigneurs font rage depuis des décennies au sein du Conseil. Il est temps donc que l'[Emperor.GetEmpereurImperatriceDirCap] tranche la question et impose sa décision, de manière ferme et définitive, soit en protégeant les droits de la paysannerie, soit en lui imposant le contrôle des nobles."
 incident_great_peasants_war_emperor_alert:0 "Les conflits violents entre paysans et seigneurs font rage depuis des décennies au sein du Conseil. Il est temps donc que l'[Emperor.GetEmpereurImperatriceDirCap] tranche la question et impose sa décision, de manière ferme et définitive, soit en protégeant les droits de la paysannerie, soit en lui imposant le contrôle des nobles."
 incident_shadow_kingdom_member_alert:0 "Si le royaume d'Italie relève toujours officiellement du Conseil des Communes Libres, il est dans les faits devenu un « royaume fantôme ». Les États italiens agissent en toute indépendance de l'[Emperor.GetEmpereurImperatriceDirCap], et les échecs successifs des titulaires du titre de Président à restaurer leur autorité sur la région ont laissé de vastes pans de territoire sous le contrôle de potentats qui rejettent toute cohésion du Conseil.\n\nLa question désormais pour les Italiens est donc de savoir pour quelle raison ils devraient même reconnaître la suzeraineté de [Emperor.Monarch.GetName] [Emperor.Monarch.Dynasty.GetName]."
 incident_shadow_kingdom_emperor_alert:0 "Si le royaume d'Italie relève toujours officiellement du Conseil des Communes Libres, il est dans les faits devenu un « royaume fantôme ». Les États italiens agissent en toute indépendance de l'[Emperor.GetEmpereurImperatriceDirCap], et les échecs successifs des titulaires du titre de Président à restaurer leur autorité sur la région ont laissé de vastes pans de territoire sous le contrôle de potentats qui rejettent toute cohésion du Conseil.\n\nLa question désormais pour les Italiens est donc de savoir pour quelle raison ils devraient même reconnaître la suzeraineté de [Emperor.Monarch.GetName] [Emperor.Monarch.Dynasty.GetName]."
 incident_dutch_revolt_member_alert:0 "La révolte des Pays-Bas est devenue bien davantage que des troubles régionaux, déclenchant une véritable crise internationale à mesure que davantage de pays ont commencé à solder leurs armées à chacun des deux camps. La république des Provinces-Unies, tout juste proclamée, se trouve au sein des frontières du Conseil ; aussi sont-ils nombreux à penser qu'il est du devoir de l'[Emperor.GetEmpereurImperatriceDir] [Emperor.Monarch.GetName] d'étendre la protection du Conseil à la jeune nation. Mais une telle intervention, quelle que soit la forme qu'elle puisse prendre, va assurément orienter à jamais le destin des Pays-Bas."
 incident_dutch_revolt_emperor_alert:0 "La révolte des Pays-Bas est devenue bien davantage que des troubles régionaux, déclenchant une véritable crise internationale à mesure que davantage de pays ont commencé à solder leurs armées à chacun des deux camps. La république des Provinces-Unies, tout juste proclamée, se trouve au sein des frontières du Conseil ; aussi sont-ils nombreux à penser qu'il est du devoir de l'[Emperor.GetEmpereurImperatriceDir] [Emperor.Monarch.GetName] d'étendre la protection du Conseil à la jeune nation. Mais une telle intervention, quelle que soit la forme qu'elle puisse prendre, va assurément orienter à jamais le destin des Pays-Bas."
 shadow_kingdom.3.d2:0 "Conformément à ses promesses, l'[Emperor.GetEmpereurImperatriceDir] [Emperor.Monarch.GetName] a raffermi son contrôle sur les communes d'Italie, s'assurant ainsi qu'ils resteront bien au sein du Conseil. Ayant apporté la preuve de toutes ses capacités diplomatiques et militaires, c'est désormais l'ensemble de la Chrétienté qui comprend désormais qu'il serait vain de défier [Emperor.GetLeLaFDir] souverain[Emperor.GetXEDir] du Conseil des Communes Libres."
 imperial_nobility_reform:0 "Noblesse du Conseil"
 imperial_nobility_reform_desc:0 "La majorité des nobles de l'Ancien Régime sont désormais enterrés dans des fosses communes, sans tête. L'heure est venue de rétablir notre propre noblesse, structurée selon un cadre répondant mieux aux objectifs du Conseil. En attribuant des titres uniquement aux citoyens loyaux et aux membres de la famille du Conseil, nous pourrons veiller à ce que cette noblesse nouvelle ne contreviendra jamais aux intérêts du pouvoir."
 imperial_decree_reform_desc:0 "Le Président est le souverain suprême de la nation, et toute déloyauté envers sa personne est une traîtrise envers la Révolution. Tous les décrets du Conseil visant à assurer les intérêts de la nation, de la Révolution et du Conseil, aussi la déloyauté doit-elle être châtiée."
 emperor_of_the_revolution_reform:0 "Président de la Révolution"
 emperor_of_the_revolution_reform_desc:0 "La Révolution est née dans notre pays, et c'est notre Président qui en est l'âme. Il est donc naturel qu'il soit couronné comme celui qui gouverne tous les partisans de la Révolution et que la nation se rassemble autour de lui."
 desc_legitimate_subject_elector_modifer:0 "[Root.GetLeLaNPCap] [Root.GetName] peu[Root.GetTVentNP] être détenu[Root.GetXENP] comme dépendance sans que les conseillers ne condamnent cette situation."
 opinion_pap_joins_empire:0 "Le pape a intégré le Conseil"
 shadow_kingdom_will_leave_info_decision_tt:0 "N'a pas encore été placé sous contrôle et pourrait quitter le Conseil des Communes Libres."
 opinion_left_hre:0 "A quitté le Conseil"
 HRE_RELIGION_NOT_LOCKED:0 "Aucune religion officielle n'a été établie dans le Conseil des Communes Libres."
 HRE_RELIGION_SET:0 "La foi $NEW|Y$ devient la religion dominante au sein du Conseil des Communes Libres."
 HRE_HERETIC_RELIGION_SET:0 "La foi $NEW|Y$ devient la religion d'opposition au sein du Conseil des Communes Libres."
 HRE_RELIGIOUS_WAR_DESC:0 "Le Conseil des Communes Libres est déchiré par l'affrontement des religions catholique et protestante. Au cours d'un tel conflit, il est permis d'intégrer les ligues protestante et catholique, et la ligue s'opposant à la religion dominante du Conseil peut déclarer la guerre au Président pour tenter de faire de sa foi la religion dominante."
 HRE_RELIGIOUS_PEACE_DESC:0 "Un traité de paix religieuse perpétuelle a été établi dans le Conseil des Communes Libres. Les communes du Conseil sont libres de choisir leur propre confession, et le Président peut appartenir à n'importe quelle confession."
 HRE_OFFICIAL_RELIGION_DESC:0 "La foi $RELIGION$ prédomine au sein du Conseil des Communes Libres. Seuls les dirigeants de cette confession peuvent être élus à la dignité du Conseil."
 HRE_PERMANENT_RELIGION_DESC:0 "La foi $RELIGION$ est la religion officielle du Conseil des Communes Libres. Seuls les dirigeants de cette confession peuvent être élus à la dignité du Conseil, et tous les conseillers doivent être de cette même confession. Le Président peut faire usage de l'action diplomatique « Imposer l'unité religieuse » envers les États membres appartenant à toute autre confession."
 HRE_RELIGION_LOCKED:0 "La religion du Conseil des Communes Libres est officielle et immuable."
 HRE_RELIGION_UNLOCKED:0 "La religion du Conseil des Communes Libres n'est PAS officielle ni immuable."
 HRE_RELIGION_TREATY:0 "Le Conseil des Communes Libres a signé un traité de paix religieuse."
 HRE_RELIGION_NO_TREATY:0 "Le Conseil des Communes Libres n'a PAS signé de traité de paix religieuse."
 IS_HRE_RELIGION:0 "La foi $RELIGION|Y$ est la religion dominante dans le Conseil des Communes Libres."
 IS_NOT_HRE_RELIGION:0 "La foi $RELIGION|Y$ n'est PAS la religion dominante dans le Conseil des Communes Libres."
 IS_HRE_HERETIC_RELIGION:0 "La foi $RELIGION|Y$ est la religion d'opposition dans le Conseil des Communes Libres."
 IS_NOT_HERETIC_HRE_RELIGION:0 "La foi $RELIGION|Y$ n'est PAS la religion d'opposition dans le Conseil des Communes Libres."
 HRE_LEAGUE_LEADER_SCORE:0 "Pour devenir le nouveau meneur de cette ligue, $COUNTRY|Y$ doit avoir un score militaire supérieur à $SCORE_NEEDED|Y$, du fait que le meneur actuel a un score de $SCORE_LEADER|Y$. Le score militaire actuel de $COUNTRY|Y$ est de $SCORE_CURRENT|Y$.\nCe score est fonction des réserves militaires maximales, de la limite des forces et des tactiques. Être en guerre le réduit de façon importante, tandis qu'être conseiller l'accroît."
 HRE_LEADER_ALWAYS_EMPEROR:0 "Le meneur de cette ligue est toujours le Président."
 religious_leagues.1.d:0 "La guerre de religion au sein du Conseil s'est achevée sur la victoire totale de l'[Emperor.GetEmpereurImperatriceDir] [Emperor.Monarch.GetName]. L'Assemblée générale du Conseil s'est réunie pour proclamer que le catholicisme sera désormais l'unique religion reconnue au sein du Conseil des Communes Libres. Les conseillers d'autres confessions perdront leurs privilèges, et l'[Emperor.GetEmpereurImperatriceDir] pourra désormais imposer au sein du Conseil l'unité religieuse autour de la foi catholique."
 religious_leagues.2.d:0 "La guerre de religion au sein du Conseil s'est achevée sur la victoire de l'Union évangélique. L'[Emperor.GetEmpereurImperatriceDir] a été contraint[Emperor.GetXEDir] d'abdiquer, et le protestantisme est désormais la religion dominante au sein du Conseil des Communes Libres."
 religious_leagues.3.d:0 "La guerre de religion au sein du Conseil s'est achevée sur la victoire de la Ligue catholique. L'[Emperor.GetEmpereurImperatriceDir] a été contraint[Emperor.GetXEDir] d'abdiquer, et le catholicisme est désormais la religion dominante au sein du Conseil des Communes Libres."
 religious_leagues.4.d:0 "La guerre de religion au sein du Conseil s'est terminée de façon indécise, et les deux partis se sont réunis à Münster, en Westphalie, pour signer un traité de paix. Selon les termes négociés, la religion officielle de chaque État sera déterminée par son dirigeant, en application de la doctrine « Tel commune, telle religion »."
 religious_leagues.5.d:0 "Après que l'[Root.GetEmpereurImperatriceDir] [Root.Monarch.GetName], lors d'une Assemblée générale du Conseil, a rejeté les positions confessionnelles protestantes, les États protestants au sein du Conseil ont formé la Ligue de Smalkalde, disposant d'une armée et d'une trésorerie communes, et cherchant à tisser des liens avec l'étranger. Les États catholiques allemands, se sentant menacés, se sont donc regroupés au sein d'une Ligue catholique. La scène est prête pour une guerre de religion au sein du Conseil…"
 religious_leagues.6.t:0 "L'Assemblée générale du Conseil de [Root.Capital.GetCapitalName]"
 religious_leagues.6.d:0 "Face à l'impossibilité pour l'Union évangélique de vaincre l'[Emperor.GetEmpereurImperatriceDir], l'Assemblée générale du Conseil s'est réunie pour proclamer que le catholicisme sera désormais l'unique religion reconnue au sein du Conseil des Communes Libres. Les conseillers d'autres confessions perdront leurs privilèges, et l'[Emperor.GetEmpereurImperatriceDir] pourra imposer au sein du Conseil l'unité religieuse autour de la foi catholique."
 religious_leagues.7.t:0 "L'Assemblée générale du Conseil de [Root.Capital.GetCapitalName]"
 religious_leagues.7.d:0 "Face à l'impossibilité pour la Ligue catholique de vaincre l'[Emperor.GetEmpereurImperatriceDir], l'Assemblée générale du Conseil s'est réunie pour proclamer que le protestantisme sera désormais l'unique religion reconnue au sein du Conseil des Communes Libres. Les conseillers d'autres confessions perdront leurs privilèges, et l'[Emperor.GetEmpereurImperatriceDir] pourra imposer au sein du Conseil l'unité religieuse autour de la foi protestante."
 religious_leagues.8.t:0 "Triomphe du Président"
 religious_leagues.8.d:0 "La guerre de religion au sein du Conseil s'est achevée sur la victoire totale de l'[Emperor.GetEmpereurImperatriceDir]. L'Assemblée générale du Conseil s'est réunie pour proclamer que le catholicisme sera désormais l'unique religion au sein du Conseil des Communes Libres. Les conseillers d'autres confessions perdront leurs privilèges, et l'[Emperor.GetEmpereurImperatriceDir] pourra imposer au sein du Conseil l'unité religieuse autour de la foi catholique."
 HRE_ON_OTHER_CONTINENT:0 "§R– Nous ne pouvons intégrer une ligue si notre capitale n'est pas sur le même continent que le Conseil des Communes Libres.§!"
 desc_joined_league_war:0 "Notre participation aux guerres de religion du Conseil des Communes Libres nous a enseigné des leçons importantes en matière militaire."
 hre_dominant_catholic:0 "Conseil des Communes Libres catholique"
 desc_hre_dominant_catholic:0 "Le catholicisme est la religion officielle du Conseil des Communes Libres. Le fait que nous soyons nous-mêmes catholiques accorde [Root.GetAuAlaNP] [Root.GetName] une certaine légitimité morale."
 hre_dominant_protestant:0 "Conseil des Communes Libres protestant"
 desc_hre_dominant_protestant:0 "Le protestantisme est la religion officielle du Conseil des Communes Libres. Le fait que nous soyons nous-mêmes protestants accorde [Root.GetAuAlaNP] [Root.GetName] une certaine légitimité morale."
 league_events.1.d:0 "La politique des Réunions de Louis XIV fut imposée au Conseil des Communes Libres en 1684 par la trêve de Ratisbonne, en grande partie parce que le Président était à ce moment inquiet de la menace turque, marquée par le siège de Vienne de 1683. Les revendications incessantes de la France, et son expansion continue par la prise de contrôle de possessions des Habsbourgs et des États allemands du Conseil, menèrent cependant en 1686 à la création de la Ligue d'Augsbourg, dirigée contre la France."
 league_events.2.d:0 "La politique des Réunions de Louis XIV fut imposée au Conseil des Communes Libres en 1684 par la trêve de Ratisbonne, en grande partie parce que le Président était à ce moment inquiet de la menace turque, marquée par le siège de Vienne de 1683. Les revendications incessantes de la France, et son expansion continue par la prise de contrôle de possessions des Habsbourgs et des États allemands du Conseil, menèrent cependant en 1686 à la création de la Ligue d'Augsbourg, dirigée contre la France."
 league_events.5.d:0 "Après que le Président Charles Quint, lors de l'Assemblée générale du Conseil d'Augsbourg de 1530, eut rejeté les positions confessionnelles luthériennes, les États protestants du Nord du Conseil des Communes Libres formèrent la Ligue de Smalkalde, disposant d'une armée et d'une trésorerie commune, et cherchant à tisser des liens avec l'étranger, notamment la France. La Ligue connut quelques succès initiaux, de 1532 à 1540, le Président étant alors menacé par le danger turc, qui le contraignit à conclure des accords de paix religieuse, à Nuremberg en 1532, puis à Kaaden en 1534."
 league_events.7.d:0 "L'équilibre du Conseil des Communes Libres ne pouvait qu'être précaire, tout partagé qu'il était entre dix États majeurs, quatre cents principautés de moindre importance, et deux religions irréconciliables. Au-delà de leurs possessions propres, la puissance des présidents était relativement limitée, et le comportement fantasque et incohérent de certains d'entre eux, tel Rodolphe II, ne fit qu'accroître les tensions.\n\nEn 1608, la cité protestante de Donauwörth, ayant refusé aux catholiques le droit de pratiquer leur culte, se retrouva au ban du Conseil. En réaction, la plupart des États protestants du Conseil formèrent l'Union évangélique, visant à défendre leurs libertés."
 hre_event.1.d:0 "Si le royaume d'Italie relève toujours officiellement du Conseil des Communes Libres, il est dans les faits devenu un « royaume fantôme ». Les États italiens agissent en toute indépendance de l'[Emperor.GetEmpereurImperatriceDir], et les échecs successifs des titulaires du titre de Président à restaurer leur autorité sur la région ont laissé de vastes pans de territoire sous le contrôle de potentats qui rejettent toute cohésion du Conseil.\n\nLa question désormais pour les Italiens est donc de savoir pour quelle raison ils devraient même reconnaître la suzeraineté de [Emperor.Monarch.GetName] [Emperor.Monarch.Dynasty.GetName]."
 hre_event.1.a:0 "Le Conseil ne nous concerne plus"
 hre_event.1.b:0 "[Root.GetLeLaNPCap] [Root.GetName] relèv[Root.GetEEntNP] évidemment du Conseil des Communes Libres"
 hre_event.3.d:0 "Si le royaume d'Italie relève toujours officiellement du Conseil des Communes Libres, il est dans les faits devenu un « royaume fantôme ». Les États italiens agissent en toute indépendance de l'[Emperor.GetEmpereurImperatriceDir], et les échecs successifs des titulaires du titre de Président à restaurer leur autorité sur la région ont laissé de vastes pans de territoire sous le contrôle de potentats qui rejettent toute cohésion du Conseil.\n\nDésormais donc, les Italiens ne sont plus membres du Conseil des Communes Libres que de nom."
 hre_event.4.t:0 "Royaume d'Italie et Conseil des Communes Libres"
 hre_event.4.d:0 "Cela fait bien des années maintenant que la cohésion du Conseil sur le royaume d'Italie ne fait que décliner. Les présidents successifs ne sont pas parvenus à imposer leur volonté aux Italiens, quand bien même ceux-ci agissaient de plus en plus visiblement sans tenir aucun compte des lois et coutumes du Conseil des Communes Libres.\n\nÀ moins que ces imprévisibles potentats d'Italie du Nord ne soient ramenés avec fermeté dans le giron du Conseil, l'Italie pourrait bien échapper, à tout jamais, au contrôle du Conseil."
 hre_event.4.a.tt:0 "À moins que tout le §Yroyaume d'Italie§! appartienne au Conseil des Communes Libres avant 1490 et y soit maintenu jusqu'en 1550, les États de la région sont susceptibles de quitter le Conseil."
 hre_event.4.b.tt:0 "À moins que toutes ces contrées appartiennent au Conseil des Communes Libres avant 1490 et y soit maintenues jusqu'en 1550, tous les États italiens se verront offrir la possibilité de quitter le Conseil :\n§YPiémont§!\n§YLombardie§!\n§YÉmilie-Romagne§!\n§YLigurie§!\n§YToscane§!\n§YItalie centrale§!\n§YVénétie§! (à l'exception de Venice)."
 hre_event.5.t:0 "[From.GetLeLaNPCap] [From.GetName] quitt[From.GetEEntNP] le Conseil"
 hre_event.5.d:0 "Le Conseil des Communes Libres a été déchiré par la formation d'un nouvel État, [From.GetLeLaNP] [From.GetName], formé sur des territoires qui sont légitimement nôtres. Notre incapacité à y mettre fin a de plus fait voler en éclat notre autorité sur les territoires qui restent encore dans le Conseil."
 hre_event.8.desc:0 "[From.GetLeLaLDirCap] [From.GetDir] [From.GetDuDeNP] [From.GetName] vient de se présenter à [Root.Capital.GetCapitalName] pour y faire une offre assez généreuse : [From.GetIlElleDir] souhaiterait, pour 6000 ducats, racheter le titre de conseiller du Conseil des Communes Libres que détient sa dépendance. Certains à la cour s'y opposent, au motif qu'une telle charge ne devrait en aucun cas être achetée, mais il convient de l'admettre : le trésor s'accommoderait fort bien de cet or."
 hre_event.9.desc:0 "Après s'être rendu[Root.GetXEDir] en personne jusqu'à [From.Capital.GetCapitalName], capitale [From.GetDuDelaNP] [From.GetName] et du Conseil des Communes Libres, [Root.GetLeLaLDir] [Root.GetDir] a pu y faire son offre à [From.Monarch.GetName] : le transfert de le siège de notre dépendance [Root.GetAuAlaNP] [Root.GetName]. Et, après y avoir réfléchi quelque temps et consulté ses conseillers, l'[From.GetEmpereurImperatriceDirCap] a accepté !"
 hre_event.9.a.tt:0 "[This.GetLeLaLDirCap] [This.GetDir] [This.GetDuDeNP] §Y[This.GetName]§! n'est plus §Yélec[This.GetTeurTriceDir]§! du Conseil des Communes Libres."
 hre_event.10.desc:0 "Après s'être rendu[Root.GetXEDir] en personne jusqu'à [From.Capital.GetCapitalName], capitale [From.GetDuDelaNP] [From.GetName] et du Conseil des Communes Libres, [Root.GetLeLaLDir] [Root.GetDir] a pu y faire son offre à [From.Monarch.GetName] : le transfert de le siège de notre dépendance [Root.GetAuAlaNP] [Root.GetName]. Mais, après y avoir réfléchi quelque temps et consulté ses conseillers, l'[From.GetEmpereurImperatriceDirCap] a refusé."
 hre_event.11.desc:0 "[From.GetLeLaLDirCap] [From.GetDir] [From.GetDuDeNP] [From.GetName] vient de se présenter à [Root.Capital.GetCapitalName] pour y faire une demande : le transfert à son profit du titre de conseiller que détient sa dépendance. Certains à la cour ont bien souligné que nous entretenons avec [From.GetLuiElleDir] des liens étroits, aussi répondre favorablement pourrait-il assurer quelques faveurs de sa part à l'avenir."
 hre_event.12.desc:0 "Après s'être rendu[Root.GetXEDir] en personne jusqu'à [From.Capital.GetCapitalName], capitale [From.GetDuDelaNP] [From.GetName] et du Conseil des Communes Libres, [Root.GetLeLaLDir] [Root.GetDir] a pu y présenter sa requête à [From.Monarch.GetName] : le transfert de le siège de notre dépendance [Root.GetAuAlaNP] [Root.GetName]. Et, après y avoir réfléchi quelque temps et consulté ses conseillers, l'[From.GetEmpereurImperatriceDirCap] a accepté !"
 hre_event.13.desc:0 "Après s'être rendu[Root.GetXEDir] en personne jusqu'à [From.Capital.GetCapitalName], capitale [From.GetDuDelaNP] [From.GetName] et du Conseil des Communes Libres, [Root.GetLeLaLDir] [Root.GetDir] a pu y présenter sa requête à [From.Monarch.GetName] : le transfert de le siège de notre dépendance [Root.GetAuAlaNP] [Root.GetName]. Mais, après y avoir réfléchi quelque temps et consulté ses conseillers, l'[From.GetEmpereurImperatriceDirCap] a refusé."
 hre_event.14.desc:0 "[From.GetLeLaLDirCap] [From.GetDir], notre suzerain[From.GetXEDir], est parvenu[From.GetXEDir] à obtenir de l'[Emperor.GetEmpereurImperatriceDirCap] [Emperor.Monarch.GetName] le transfert de notre titre de conseiller [From.GetAuAlaNP] [From.GetName]. [Root.GetLeLaNPCap] [Root.GetName] se trouv[Root.GetEEntNP] donc dépouillé[Root.GetXENP] de cette charge prestigieuse !"
 desc_mng_backed_by_emperor_of_china_modifier:0 "La dynastie du Conseil des [EmperorOfChina.Monarch.Dynasty.GetName] a témoigné de son soutien envers [Root.Monarch.GetName], ce qui lui confère un surcroît de légitimité et d'influence."
 desc_mng_outer_wall_beijing_and_imperial_granary_modifier:0 "De larges fortifications ont été construites autour de la ville intérieure de [Root.GetCapitalName] afin d'y abriter les habitants toujours plus nombreux, ainsi que le grenier du Conseil, plus grande réserve de denrées du pays."
 desc_chi_new_emperor_modifier:0 "Reprendre l'héritage du Conseil de Chine a assurément renforcé la dynastie [Root.Monarch.Dynasty.GetName] et l'a fait entrer dans les annales de l'histoire."
 desc_chi_imperial_center_of_commerce_modifier:0 "La province de [Root.GetName] est protégée par [Root.Owner.GetLeLaLDir] [Root.Owner.GetDir] [Root.Owner.GetLuiElleDir]-même, car il s'agit d'un carrefour commercial vital pour assurer la prospérité du Conseil."
 unlock_issue_establish_the_imperial_diet_act_tt:0 "Donne accès à la loi [Root.GetDuDelaParlement] [Root.GetParliamentOrFallbackName] §YActe sur l'Assemblée générale du Conseil§!."
 unlock_issue_crown_of_the_empire_act_tt:0 "Donne accès à la loi [Root.GetDuDelaParlement] [Root.GetParliamentOrFallbackName] §YActe de la Couronne du Conseil§!."
 desc_tur_advance_into_europe:0 "La grande cité de Vienne est tombée. Il est désormais évident pour tous que le Conseil des Communes Libres, obstacle dressé autrefois face à l'expansion [Root.GetRootAdjFS], n'est pas en mesure de nous résister. La route de l'Europe nous est ouverte !"
 desc_tur_religious_empire:0 "Tous les habitants du Conseil sont unis par leur foi et leurs croyances. [Root.GetLeLaLDirCap] [Root.GetDir] propage la vérité [Root.GetDuDelaRel] [Root.GetRelN] dans le monde et est [Root.GetCeluiCelleDir] qui amène les hérétiques sur la voie de la véritable foi."
 desc_tur_imperial_muslim_center:0 "La cité de [Root.GetCapitalName] est le coeur [Root.Owner.GetDuDelaRel] [Root.Owner.GetRelN] du Conseil. Lettrés, philosophes, et [Root.Owner.GetClercs] originaires de toutes les régions du pays y viennent pour vivre leur foi et mener leurs affaires."
 desc_tur_the_imperial_capital:0 "[151.GetCapitalName] est le coeur du Conseil ottoman. Artisans, [Root.Owner.GetClercs], [Root.Owner.GetNobles] et négociants s'y pressent et accourent pour s'établir entre ses murs."
 desc_tur_imperial_school_of_military_engineering:0 "À [Root.GetCapitalName] se trouve l'École du Conseil du génie militaire. De nombreux experts de l'artillerie et de la guerre de siège y sont formés afin de mettre à mal les défenses de nos ennemis."
 desc_tur_trade_center_of_the_ottoman_empire_modifier:0 "La province de [Root.GetName] est un carrefour commercial de première importance pour le Conseil. Des marchands venus de tout le sous-continent visitent les marchés de [Root.GetCapitalName] pour y faire des affaires."
 desc_tur_peak_of_ottoman_empire:0 "[Root.GetLeLaFDirCap] grand[Root.GetXEDir] [Root.GetDir] [Root.Monarch.GetName] a décidé de réformes d'envergure dans l'administration du Conseil, ce qui permet d'intégrer davantage de territoires que jamais auparavant."
 hre_event.15.t:0 "Disparition du Conseil des Communes Libres"
 hre_event.15.desc:0 "Avec la prise de [Emperor.Capital.GetCapitalName], [Emperor.GetLeLaLDir] [Emperor.GetDir] a été contraint[Emperor.GetXEDir] de reconnaître sa défaite face aux troupes [Root.GetRootAdjFP]. En cette année [GetYear], [Emperor.Monarch.GetName] a donc abdiqué le trône du Conseil des Communes Libres et libéré tous ses membres de leurs serments de fidélité et de leurs obligations envers [Root.GetLuiElleDir].\n\nLe Conseil des Communes Libres n'est plus, l'histoire retiendra que le responsable de sa disparition n'est autre que [Root.Monarch.GetName]."
 hre_event.15.a:0 "Enfin le Conseil n'est plus !"
 hre_event.15.b:0 "Le Conseil des Communes Libres est tombé, le Conseil [Root.GetRootAdjMS] est né"
 desc_ave_imperial_favoritism:0 "[Root.Monarch.GetName] a su convaincre les conseillers du Conseil des Communes Libres de voter en sa faveur, ce qui améliore grandement son image."
 desc_ave_expnansionist_path:0 "Le Conseil des Communes Libres, autrefois si puissant, n'est plus. L'avancée [Root.GetRootAdjFS] en Allemagne est à la mesure de [Root.GetSesLeursNP] ambitions conquérantes."
 desc_ave_imperial_parliament:0 "[Root.Monarch.GetName] étant aussi [Root.GetEmpereurImperatriceDirCap] du Conseil des Communes Libres, les responsabilités [Root.GetDuDelaParlement] [Root.GetParliamentOrFallbackName] recouvrent désormais aussi la situation dans le Conseil."
 desc_ave_end_of_the_empire:0 "Le Conseil des Communes Libres a chu. Tout ce qu'il en reste aujourd'hui, c'est un souvenir ténu, tandis que les bannières [Root.GetRootAdjFP] flottent sur les territoires qu'il recouvrait autrefois."
 act_of_imperial_diplomacy:0 "Acte sur la diplomatie du Conseil"
 act_of_imperial_diplomacy_opinion:0 "Acte sur la diplomatie du Conseil"
 imperial_religious_unity_act:0 "Acte sur l'unité religieuse du Conseil"
