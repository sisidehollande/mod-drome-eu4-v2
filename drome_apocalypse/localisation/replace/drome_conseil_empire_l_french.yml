 restore_byzantine_empire_title:0 "Restaurer le Conseil byzantin"
 improved_relations_with_electors_desc:0 "Le système électoral du Conseil des Communes Libres pose parfois problème. Nous avons ainsi remarqué, ces derniers temps, que l'Élec[Root.GetTeurTriceDir] [Root.GetDuDeNP] [Root.GetName] ne nous soutenait pas aussi fermement qu'[Root.GetIlElleDir] le devrait. Si nous souhaitons conserver le titre de Président à notre dynastie, il convient de resserrer nos liens avec [Root.GetLuiElleDir]."
 become_emperor_title:0 "Acquérir le titre de Président"
 become_emperor_desc:0 "Nous avons la chance d'avoir obtenu cette dignité électorale qui fait de nous des communes du Conseil des Communes Libres. Cependant, en resserant nos liens avec les autres conseillers, nous pourrions aussi monter sur le trône du Conseil."
