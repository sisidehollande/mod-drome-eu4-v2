 imperial_government_ruler:0 "Président"
 subjugate_burgundy_desc:0 "La Bourgogne se trouve sur la frontière entre le Conseil des Communes Libres et la France, aussi le destin de ce duché revêt-il une importance capitale pour nous. Si le pire devait survenir, nous devons nous assurer que la maison de Habsbourg ait son mot à dire."
