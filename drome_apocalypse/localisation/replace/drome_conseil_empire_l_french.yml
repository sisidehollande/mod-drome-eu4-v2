 hre_event.7.t:0 "L'Assemblée générale du Conseil perpétuelle de [From.GetCapitalName]"
 hre_event.7.d:0 "À compter de ce jour, l'Assemblée générale du Conseil siégera en session continue dans la cité de [From.GetCapitalName] plutôt que selon les circonstances, comme c'était le cas jusqu'à présent. Cela aura assurément pour effet d'accroître la cohésion du Conseil et permettra de rendre plus officielles les relations entre l'[Emperor.GetEmpereurImperatriceDirCap] et les communes. Évidemment, il y a aussi des chances que cela fasse de [From.GetCapitalName] une cible privilégiée pour quiconque voudrait mettre à mal le Conseil des Communes Libres."
