 CONFIRMJOINHRE:0 "Extension du Conseil des Communes Libres"
 CONFIRMJOINHRETEXT:0 "Le Conseil des Communes Libres n'a souvent été qu'une fédération assez lâche de royaumes et de principautés, recouvrant une grande partie de l'Europe centrale, et dont les territoires allemands et autrichiens ont toujours été le coeur. Toutefois, son extension a pu varier selon les époques.\n\nSouhaitez-vous faire entrer la province de $PROV|Y$ dans le Conseil des Communes Libres ?"
 CONFIRMJOINHREWOULDMEMBER:0 "§YCela ferait de notre pays un membre du Conseil des Communes Libres.§!"
 CONFIRMJOINHREWOULDMEMBERWARN:0 "§RCela ferait de notre pays un membre du Conseil des Communes Libres mais nous ferait tomber au rang politique de $RANK|Y$.§!"
 CONFIRMLEAVEHRE:0 "Quitter le Conseil des Communes Libres"
 CONFIRMLEAVEHRETEXT:0 "La population de $PROV$ se lasse des querelles incessantes au sein du Conseil, qu'elles soient d'ordre religieux ou politique. Les relations avec le Président sont au plus bas, et la piètre réputation du $TITLE$ $MONARCHNAME$ est loin d'améliorer notre situation. Beaucoup pensent que la province de $PROV$ aurait tout intérêt à quitter le Conseil.\nSouhaitez-vous vraiment le faire ?"
