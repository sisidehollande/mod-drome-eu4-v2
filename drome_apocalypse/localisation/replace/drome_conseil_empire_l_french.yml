 IMPERIALRELATIONSTITLE:0 "Accorder la grâce du Conseil"
 IMPERIALRELATIONSNEWDESC:0 "Souhaitez-vous vraiment accorder la grâce du Conseil à $COUNTRY|Y$ ?\nCela nous coûtera $COST|Y$ en cohésion du Conseil mais améliorera considérablement nos relations avec ce pays."
 IMPERIALRELATIONSDESC:0 "Cela améliorerait considérablement nos relations, au prix de $COST|Y$ points d'cohésion du Conseil."
 HRE_INFLUENCE_DESC:0 "La cohésion du Conseil représente la capacité qu'a le Président à contrôler les communes du Conseil. Elle est nécessaire pour entreprendre la moindre réforme du Conseil. Une cohésion du Conseil élevée peut inciter d'autres pays à intégrer le Conseil des Communes Libres."
 HRE_INFLUENCE_GAIN:0 "La cohésion du Conseil s'accroît lorsque :\n– de nombreux États membres appartiennent au Conseil ;\n– ils sont en paix ;\n– des pays intègrent le Conseil ;\n– des présidents successifs proviennent du même pays ;\n– le Président vote comme la majorité des communes lors des incidents impériaux."
 HRE_INFLUENCE_LOSS:0 "Elle décroît lorsque :\n– les appels aux armes des membres ne sont pas honorés ;\n– des provinces quittent le Conseil ;\n– des territoires du Conseil sont sous contrôle de pays extérieurs ;\n– des territoires du Conseil sont sous contrôle de païens ou d'hérétiques ;\n– il y a moins de sept conseillers ;\n– le Président vote différemment de la majorité des communes lors des incidents impériaux."
