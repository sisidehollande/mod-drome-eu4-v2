 drome_convoquer_conseil_title:0 "Saisir le Conseil des Communes Libres"
 drome_convoquer_conseil_desc:0 "Soumettre une motion a l'Assemblee generale puis au Conseil des 20 sieges (veto des 5 permanents). Coute 50 points diplomatiques. Delai : 3 ans."
 drome_armer_fusils_title:0 "Armer les milices de fusils de chasse"
 drome_armer_fusils_desc:0 "Distribuer les fusils de chasse de la région. Débloque les Chasseurs au fusil pour 100 ducats."
 drome_motoriser_milices_title:0 "Motoriser les milices"
 drome_motoriser_milices_desc:0 "Remettre en état tracteurs, pick-up et camionnettes. Débloque le Véhicule motorisé pour 400 ducats (fusils requis)."
 drome_forger_chars_title:0 "Forger des chars d'assaut"
 drome_forger_chars_desc:0 "Blinder des engins agricoles et militaires récupérés. Débloque le Char d'assaut pour 1500 ducats (véhicules requis)."
 drome_horde.1.t:0 "Ampleur de la menace"
 drome_horde.1.d:0 "Les anciens parlent d'une horde qui viendra de la mer dans un siècle. Jusqu'où faut-il croire aux légendes ?"
 drome_horde.1.a:0 "Elle sera clairsemée (Horde faible)"
 drome_horde.1.b:0 "Elle sera nombreuse (Horde normale)"
 drome_horde.1.c:0 "Elle sera innombrable (Horde brutale)"
 drome_horde.2.t:0 "Des feux sur la mer"
 drome_horde.2.d:0 "Les guetteurs de la côte rapportent des lueurs étranges au large, au nord-ouest de Vanosc. Elles dansent sur des îlots que personne n'avait jamais vus."
 drome_horde.2.a:0 "Doubler les guets"
 drome_horde.2.b:0 "Prier en silence"
 drome_horde.3.t:0 "La Horde"
 drome_horde.3.d:0 "La Horde"
 drome_horde.3.a:0 "Elle arrive."
 drome_horde.4.t:0 "La Horde est là"
 drome_horde.4.d:0 "Des îlots de la Brume, une marée de silhouettes titubantes déferle vers nos côtes. Elles ne parlent pas, ne mangent pas et ne s'arrêtent pas. Il ne s'agit plus de rumeurs."
 drome_horde.4.a:0 "Que Dieu nous garde"
 drome_horde.10.t:0 "Débarquement"
 drome_horde.10.d:0 "Débarquement"
 drome_horde.10.a:0 "Bien."
 drome_horde.11.t:0 "Contagion"
 drome_horde.11.d:0 "Contagion"
 drome_horde.11.a:0 "Bien."
 drome_horde.12.t:0 "Guerre contre la Horde"
 drome_horde.12.d:0 "Guerre contre la Horde"
 drome_horde.12.a:0 "Bien."
 drome_horde.20.t:0 "La fin de la Horde"
 drome_horde.20.d:0 "La dernière silhouette est tombée. Après un siècle de peur, la plaine et la montagne respirent enfin. Les communes de Drôme et d'Ardèche peuvent reconstruire."
 drome_horde.20.a:0 "Nous avons survécu"
 drome_conseil.1.t:0 "Conseil des Communes Libres"
 drome_conseil.1.d:0 "Le Conseil des Communes Libres siege. Chaque commune a une voix a l'Assemblee generale. Si elle approuve la motion, le Conseil de 20 sieges tranche : les 5 grandes puissances y sont membres permanents et peuvent y opposer leur veto. Quelle motion soumettre ?"
 drome_conseil.1.defense:0 "Un pacte de défense commune"
 drome_conseil.1.greniers:0 "La mise en commun des greniers"
 drome_conseil.1.taxe:0 "Une taxe de route commune"
 drome_conseil.1.milice:0 "La levée d'une milice des communes"
 drome_conseil.1.arsenal:0 "Un arsenal commun (fusils de chasse pour tous)"
 drome_conseil.1.z:0 "Ajourner la séance"
 drome_conseil.2.t:0 "Vote du Conseil"
 drome_conseil.2.d:0 "Les voix sont comptées."
 drome_conseil.2.a:0 "Bien."
 drome_conseil.4.t:0 "Rejet par l'Assemblee generale"
 drome_conseil.4.d:0 "Moins de la moitie des communes ont vote la motion a l'Assemblee generale. Elle est rejetee sans meme etre soumise au Conseil."
 drome_conseil.4.a:0 "Nous reviendrons."
 drome_conseil.11.t:0 "Pacte de défense adopté"
 drome_conseil.11.d:0 "La motion a ete approuvee par l'Assemblee generale puis adoptee par le Conseil des Communes Libres, sans veto : Pacte de defense."
 drome_conseil.11.a:0 "La séance est levée. (Toutes les communes : +10 % moral, +10 % défense, moins d'agitation pendant 10 ans)"
 drome_conseil.12.t:0 "Greniers communs adoptés"
 drome_conseil.12.d:0 "La motion a ete approuvee par l'Assemblee generale puis adoptee par le Conseil des Communes Libres, sans veto : Greniers communs."
 drome_conseil.12.a:0 "La séance est levée. (Toutes les communes : -20 % d'attrition, récupération de main-d'oeuvre +15 % pendant 10 ans)"
 drome_conseil.13.t:0 "Taxe de route adoptée"
 drome_conseil.13.d:0 "La motion a ete approuvee par l'Assemblee generale puis adoptee par le Conseil des Communes Libres, sans veto : Taxe de route."
 drome_conseil.13.a:0 "La séance est levée. (Toutes les communes : +15 % revenus fiscaux, un peu d'agitation pendant 10 ans)"
 drome_conseil.14.t:0 "Milice des communes adoptée"
 drome_conseil.14.d:0 "La motion a ete approuvee par l'Assemblee generale puis adoptee par le Conseil des Communes Libres, sans veto : Milice des communes."
 drome_conseil.14.a:0 "La séance est levée. (Toutes les communes : +20 % main-d'oeuvre, +15 % limite des forces terrestres pendant 10 ans)"
 drome_conseil.15.t:0 "Arsenal commun adopté"
 drome_conseil.15.d:0 "La motion a ete approuvee par l'Assemblee generale puis adoptee par le Conseil des Communes Libres, sans veto : Arsenal commun."
 drome_conseil.15.a:0 "La séance est levée. (Toutes les communes : Chasseurs au fusil débloqués, +10 % puissance de feu pendant 10 ans)"
 drome_conseil.5.t:0 "Veto au Conseil"
 drome_conseil.5.d:0 "Un membre permanent du Conseil a vote contre et fait tomber la motion, malgre l'Assemblee generale."
 drome_conseil.5.a:0 "Le veto est tombe."
 drome_conseil.6.t:0 "Motion rejetee par le Conseil"
 drome_conseil.6.d:0 "La motion a obtenu l'accord de l'Assemblee generale, mais pas la majorite des 11 sieges sur 20 au Conseil."
 drome_conseil.6.a:0 "Nous reviendrons."
 drome_conseil.30.t:0 "Election du Conseil"
 drome_conseil.30.d:0 "Les sieges du Conseil sont renouveles."
 drome_conseil.30.a:0 "Bien."
 drome_conseil.31.t:0 "Fin de mandat"
 drome_conseil.31.d:0 "Le mandat du Conseil prend fin."
 drome_conseil.31.a:0 "Bien."
 drome_conseil.32.t:0 "Siege permanent au Conseil"
 drome_conseil.32.d:0 "Votre commune compte parmi les cinq grandes puissances des Communes Libres : vous obtenez un siege permanent au Conseil, avec droit de veto, pour cinq ans."
 drome_conseil.32.a:0 "Nous siegerons avec fierte."
 drome_conseil.33.t:0 "Siege elu au Conseil"
 drome_conseil.33.d:0 "L'Assemblee generale vous a elu l'un des quinze sieges non permanents du Conseil des Communes Libres pour cinq ans."
 drome_conseil.33.a:0 "Nous porterons votre voix."
 ccl_siege_permanent:0 "Siege permanent au Conseil"
 ccl_siege_elu:0 "Siege elu au Conseil"
