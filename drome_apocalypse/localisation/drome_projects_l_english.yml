l_english:
 rochemaure_castle:0 "Château de Rochemaure"
 rochemaure_castle_desc:0 "Perché sur son rocher, le château en ruine de Rochemaure domine la vallée du Rhône. Le relever donnera de la vue, des remparts solides et des défenseurs mieux placés."
 adhemar_castle:0 "Château des Adhémar"
 adhemar_castle_desc:0 "Forteresse emblématique de Montélimar. La restaurer fera rayonner la cité : prestige, réputation diplomatique et solidité des places fortes."
